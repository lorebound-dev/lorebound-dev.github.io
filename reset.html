<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TEST · Start over · LOREBOUND</title>
<style>
body{margin:0;min-height:100vh;background:#0b1418;color:#efe3c2;font:16px/1.5 Georgia,serif}
main{max-width:420px;margin:0 auto;padding:32px 16px}
h1{margin:0 0 12px;font-size:22px;color:#f5dc96}
button{font:inherit;padding:10px 18px;border:1px solid #a38c59;border-radius:2px;background:#1c2a2f;color:#f5dc96}
a{color:#f5dc96}
</style>
</head>
<body>
<main>
<h1>Start over on the test site</h1>
<p>This deletes the save on the test site, so the test game starts from the beginning. Your real game at <a href="https://lorebound-game.github.io/">lorebound-game.github.io</a> keeps its save.</p>
<p>Close any other tabs with the test game first.</p>
<p><button id="reset" type="button">Delete the test save</button></p>
<p id="done" hidden>Done. <a href="./">Open the test game</a></p>
</main>
<script>
document.getElementById('reset').addEventListener('click', async () => {
  try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
  try { for (const db of await indexedDB.databases()) indexedDB.deleteDatabase(db.name); } catch (e) {}
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) {}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  document.getElementById('done').hidden = false;
});
</script>
</body>
</html>
